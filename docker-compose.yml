services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmrai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gmrai-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-gmrai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gmrai} -d ${POSTGRES_DB:-gmrai}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      GMRAI_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gmrai}:${POSTGRES_PASSWORD:-gmrai-change-me}@postgres:5432/${POSTGRES_DB:-gmrai}
      GMRAI_AUTO_CREATE_TABLES: "false"
      GMRAI_AUTO_MIGRATE: "true"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      GMRAI_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gmrai}:${POSTGRES_PASSWORD:-gmrai-change-me}@postgres:5432/${POSTGRES_DB:-gmrai}
      GMRAI_AUTO_CREATE_TABLES: "false"
    command: python -m app.worker_main
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
