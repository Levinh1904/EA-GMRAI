# GMRAI nginx — reverse proxy. TLS: đặt cert vào docker/certs (fullchain.pem,
# privkey.pem) rồi bỏ comment khối ssl; hoặc dùng Caddy/certbot (xem docs/DEPLOYMENT.md).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 20m;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    upstream backend_upstream { server backend:8000; }
    upstream frontend_upstream { server frontend:3000; }

    server {
        listen 80;
        server_name _;

        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /health {
            proxy_pass http://backend_upstream;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS (bật khi có cert):
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.example.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     location /api/ { proxy_pass http://backend_upstream; proxy_set_header Host $host; }
    #     location / { proxy_pass http://frontend_upstream; proxy_set_header Host $host; }
    # }
}
